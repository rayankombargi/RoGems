services:
  # Full-stack Django + React App
  - type: web
    name: roblox-experience-finder
    env: python
    region: oregon
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python health_check.py
      cd frontend && npm install && npm run build && cd ..
      mkdir -p frontend/build/images
      cp frontend/src/components/Images/* frontend/build/images/ 2>/dev/null || true
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn --config gunicorn.conf.py RobloxExperienceFinder.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NODE_VERSION
        value: 18
      - key: DATABASE_URL
        sync: false # This will use the environment variable you set manually
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: RENDER_EXTERNAL_URL
        sync: false # This will be auto-populated by Render
      - key: WEB_CONCURRENCY
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
