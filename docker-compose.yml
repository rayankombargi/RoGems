services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: robloxexperiencefinder
      MYSQL_ROOT_PASSWORD: root-local-password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot-local-password"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://root:root-local-password@db:3306/robloxexperiencefinder
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  mysql_data:
